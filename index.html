<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clarity — Pool Co-Pilot</title>
<meta name="theme-color" content="#0b1a26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clarity">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d7390'/%3E%3Cg fill='none' stroke-linecap='round'%3E%3Cpath d='M4 13 q4 -5 8 0 t8 0 t8 0' stroke='%23eafcfb' stroke-width='2.5'/%3E%3Cpath d='M4 20 q4 -5 8 0 t8 0 t8 0' stroke='%23aef2ee' stroke-width='2.5' opacity='0.7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAxUlEQVR4nO2WMQ6DMAxF/wV6Wi7CSTr1VAwMrCC1UxEK8c+3SdRKJJKn8Pyf7AwA5DyG8V2jWAY9XaAL3EOgVkhYzvPxtK17RcJyvCxwhCMSFi8J5GCPBOPdApFVMB6lJixIkSjxUAJa3ksCLScEz46fy/z6VuSN5PiTgPXKj3Da5AoP1oTBioTCg43SGp26CoVH2iStXJByp/JQAlreSwItJwTPjksSEf4kYL1yVcDLgzVRwq/yVf+WrPD//ifsAl3g1wIf73r3FbJNUS8AAAAASUVORK5CYII=">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d7390'/%3E%3Cg fill='none' stroke-linecap='round'%3E%3Cpath d='M30 78 q22 -26 44 0 t44 0 t44 0' stroke='%23eafcfb' stroke-width='12'/%3E%3Cpath d='M30 110 q22 -26 44 0 t44 0 t44 0' stroke='%23aef2ee' stroke-width='12' opacity='0.7'/%3E%3C/g%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap');
:root{
  --bg:#0b1a26; --bg2:#081420; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.08); --line2:rgba(120,200,225,.22);
  --txt:rgba(255,255,255,.9); --mut:rgba(255,255,255,.42); --mut2:rgba(255,255,255,.24);
  --aqua:#5bc6dc; --aqua2:#7fe3e0; --green:#5cc8a0; --coral:#ec8a72; --amber:#e8b96a;
  --teal1:#1a9a82; --teal2:#0d7390;
  --shadow:0 22px 60px -24px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 520px at 78% -8%,rgba(91,198,220,.16),transparent 60%),
    radial-gradient(800px 480px at -8% 112%,rgba(26,154,130,.14),transparent 58%),
    linear-gradient(165deg,var(--bg2),var(--bg));
  color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;
}
textarea:focus,input:focus,select:focus{outline:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.mono{font-family:'DM Mono',monospace}.serif{font-family:'Playfair Display',serif}

/* header */
.hd{padding:max(16px,env(safe-area-inset-top)) 20px 0;flex-shrink:0;
  background:linear-gradient(180deg,rgba(8,20,32,.9),transparent);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.hdin{max-width:660px;margin:0 auto}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:11px}
.logo .ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--teal1),var(--teal2));
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 6px 18px -4px rgba(13,115,144,.6)}
.logo .ti{font-size:21px;color:#fff;letter-spacing:.5px;line-height:1}
.logo .sub{font-size:9px;color:var(--mut2);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px}
.gear{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 13px;color:var(--mut);font-size:11px;cursor:pointer;transition:.2s}
.gear:hover{color:var(--txt);border-color:var(--line2)}

/* tab pills */
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:13px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tab{position:relative;overflow:hidden;z-index:0;background:none;border:none;cursor:pointer;padding:8px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut2);border-radius:9px;transition:.22s;white-space:nowrap;font-family:'DM Mono',monospace}
.tab span{position:relative;z-index:2}
.tab.on{color:#06222c;box-shadow:0 6px 16px -6px var(--aqua)}
.tab .wv{position:absolute;left:0;bottom:0;width:200%;height:100%;z-index:1;animation:wvflow 4s linear infinite}
.tab:not(.on):hover{color:var(--txt)}
@keyframes wvflow{to{transform:translateX(-50%)}}
.tabwrap{display:flex;justify-content:center;padding-bottom:14px}

.setup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;animation:fadeIn .25s;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.setup .lab{font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--mut);font-size:11px;cursor:pointer;transition:.2s;font-family:'DM Mono',monospace}
.chip.on{background:rgba(91,198,220,.16);border-color:var(--aqua);color:var(--aqua)}
.hint{font-size:10.5px;color:var(--mut2);margin-top:8px;line-height:1.55}

.body{flex:1;overflow-y:auto;padding:18px 20px;-webkit-overflow-scrolling:touch}
.bin{max-width:660px;margin:0 auto}

/* chat */
.msg{display:flex;margin:7px 0;animation:fadeIn .3s}
.msg.u{justify-content:flex-end}
.av{width:29px;height:29px;border-radius:50%;background:linear-gradient(135deg,var(--teal1),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-right:9px;margin-top:2px;box-shadow:0 4px 12px -4px rgba(13,115,144,.6)}
.bub{max-width:80%;padding:12px 15px;font-size:14px;line-height:1.62;white-space:pre-wrap}
.bub.a{background:var(--panel2);border:1px solid var(--line);border-radius:5px 17px 17px 17px}
.bub.u{background:linear-gradient(135deg,#1c5170,#103b56);border:1px solid rgba(91,198,220,.22);border-radius:17px 5px 17px 17px}
.dots{display:flex;gap:5px;padding:14px 17px;background:var(--panel2);border:1px solid var(--line);border-radius:5px 17px 17px 17px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bounce 1.2s ease-in-out infinite}
.sugg{margin-top:18px}
.sugg .h{font-size:10px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px}
.sg{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;color:var(--mut);font-size:13px;cursor:pointer;margin-bottom:7px;font-family:inherit;transition:.2s}
.sg:hover{color:var(--txt);border-color:var(--line2);transform:translateX(3px)}

/* generic cards / forms */
.sec{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.sec h2{font-size:15px;font-weight:600;letter-spacing:.3px}
.sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .add{background:var(--panel2);border:1px solid var(--line2);color:var(--aqua);border-radius:10px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.sec .add:hover{background:var(--aqua);color:var(--bg)}

.formcard{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:14px;box-shadow:var(--shadow)}
.formcard h3{font-size:13px;margin-bottom:15px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.inrow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.inrow label{flex:1;font-size:13px}
.inrow .rng{font-size:10px;color:var(--mut2);font-family:'DM Mono',monospace}
.inrow input{width:92px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font-size:16px;text-align:right;font-family:'DM Mono',monospace;transition:.2s}
.inrow input:focus{border-color:var(--aqua)}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:.2s}
.btn.go{background:linear-gradient(135deg,var(--teal1),var(--teal2));color:#fff;width:100%;box-shadow:0 8px 22px -10px var(--teal2)}
.btn.go:hover{filter:brightness(1.08)}
.dose{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:10px;animation:fadeIn .3s}
.dose .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dose .nm{font-size:13.5px;font-weight:600}
.dose .badge{font-size:9px;padding:2px 8px;border-radius:5px;letter-spacing:1px;font-family:'DM Mono',monospace}
.dose .amt{font-size:21px;font-family:'Playfair Display',serif;color:var(--aqua2);margin:5px 0}
.dose .ex{font-size:12px;color:var(--mut);line-height:1.55}

.hcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:10px;animation:fadeIn .3s}
.hcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.hcard .ts{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace}
.hcard .fl{font-size:10px;padding:3px 9px;border-radius:5px;font-family:'DM Mono',monospace}
.h5{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.h5 .c{text-align:center}
.h5 .ck{font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.h5 .cv{font-size:16px;font-weight:600;font-family:'Playfair Display',serif}

/* schedule */
.task{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:10px;animation:fadeIn .3s;transition:.2s}
.task:hover{border-color:var(--line2)}
.task .cb{width:25px;height:25px;border-radius:8px;border:2px solid var(--line2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);transition:.2s}
.task.done .cb{background:var(--green);border-color:var(--green)}
.task .tx{flex:1;min-width:0;cursor:pointer}
.task .tt{font-size:14px;font-weight:500}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.task .fr{font-size:11px;color:var(--mut2);font-family:'DM Mono',monospace;margin-top:1px}
.task .due{font-size:10px;padding:4px 10px;border-radius:20px;font-family:'DM Mono',monospace;letter-spacing:.5px;white-space:nowrap}
.task .del{background:none;border:none;color:var(--mut2);font-size:16px;cursor:pointer;padding:2px 4px;transition:.2s;flex-shrink:0}
.task .del:hover{color:var(--coral)}

.empty{text-align:center;padding:60px 0;color:var(--mut2)}
.empty .e{font-size:32px;margin-bottom:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,12,18,.72);backdrop-filter:blur(5px);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0}
.scrim.on{display:flex;animation:fadeIn .25s}
.modal{background:linear-gradient(165deg,#10283a,#0b1a26);border:1px solid var(--line2);border-top-left-radius:24px;border-top-right-radius:24px;
  padding:24px 22px max(24px,env(safe-area-inset-bottom));width:100%;max-width:660px;box-shadow:var(--shadow);animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal .grab{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);margin:-6px auto 16px}
.modal h2{font-size:18px;margin-bottom:18px;letter-spacing:.3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:7px}
.field input,.field select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 13px;font-size:15px;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--aqua)}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}
.mact{display:flex;gap:10px;margin-top:20px}
.mact button{flex:1;padding:12px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;border:0;font-family:inherit}
.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)!important}
.solid{background:linear-gradient(135deg,var(--teal1),var(--teal2));color:#fff}

/* input bar */
.inbar{padding:12px 16px max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(8,20,32,.85);backdrop-filter:blur(10px);flex-shrink:0}
.inbarin{max-width:660px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.photobtn{width:46px;height:46px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;transition:.2s}
.photobtn:hover{border-color:var(--line2)}
.txtwrap{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:10px 14px;display:flex;align-items:flex-end;gap:8px;transition:.2s}
.txtwrap:focus-within{border-color:var(--line2)}
.txtwrap textarea{flex:1;background:none;border:none;color:var(--txt);font-size:16px;font-family:inherit;resize:none;line-height:1.5;max-height:100px}
.send{width:33px;height:33px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:rgba(255,255,255,.05);color:var(--mut);transition:.2s}
.send.live{background:linear-gradient(135deg,var(--teal1),var(--teal2));color:#fff}
.foot{max-width:660px;margin:7px auto 0;font-size:10px;color:var(--mut2);text-align:center;font-family:'DM Mono',monospace}

/* image attachment */
.attach-preview{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);border:1px solid var(--line2);border-radius:13px;margin-bottom:8px;animation:fadeIn .2s}
.attach-preview img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.attach-preview .attach-info{flex:1;min-width:0}
.attach-preview .attach-label{font-size:12px;color:var(--txt);margin-bottom:4px}
.attach-preview .attach-hint{font-size:10px;color:var(--mut2);line-height:1.4}
.attach-preview .attach-rm{background:none;border:1px solid rgba(236,138,114,.3);color:var(--coral);border-radius:8px;padding:5px 10px;font-size:10px;cursor:pointer;font-family:inherit;transition:.2s}
.attach-preview .attach-rm:hover{background:rgba(236,138,114,.15)}
.msg-img{max-width:220px;max-height:180px;border-radius:12px;margin-bottom:6px;border:1px solid var(--line);object-fit:cover}

.gauge{position:relative;height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:9px}
.gauge .ideal{position:absolute;height:100%;background:rgba(92,200,160,.22);border-radius:3px}
.gauge .pin{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);transform:translateX(-7px)}

/* chat results card */
.rcard{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-top:10px;animation:fadeIn .3s}
.rcard-hdr{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.rcard-hdr .rcard-icon{font-size:18px}
.rcard-hdr .rcard-title{font-size:11px;color:var(--aqua);letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Mono',monospace}
.rcard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.rcard-param{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center}
.rcard-param .rp-label{font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-family:'DM Mono',monospace}
.rcard-param .rp-value{font-size:20px;font-weight:600;font-family:'Playfair Display',serif;margin-bottom:3px}
.rcard-param .rp-badge{display:inline-block;font-size:8px;padding:2px 7px;border-radius:4px;letter-spacing:1px;font-family:'DM Mono',monospace;font-weight:600}
.rcard-dose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px}
.rcard-dose .rd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.rcard-dose .rd-name{font-size:12.5px;font-weight:600}
.rcard-dose .rd-badge{font-size:8px;padding:2px 7px;border-radius:4px;letter-spacing:1px;font-family:'DM Mono',monospace}
.rcard-dose .rd-amt{font-size:17px;font-family:'Playfair Display',serif;color:var(--aqua2);margin:4px 0}
.rcard-dose .rd-ex{font-size:11px;color:var(--mut);line-height:1.5}
.rcard-save{width:100%;margin-top:10px;background:linear-gradient(135deg,var(--teal1),var(--teal2));color:#fff;border:none;border-radius:11px;padding:11px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;box-shadow:0 6px 18px -8px var(--teal2)}
.rcard-save:hover{filter:brightness(1.1)}
.rcard-save:disabled{opacity:.4;cursor:default;filter:none}
.rcard-ok{text-align:center;padding:10px 0 4px;color:var(--green);font-size:13px}
.ver-tag{font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace;letter-spacing:1px;opacity:.6}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><div class="hdin">
    <div class="hrow">
      <div class="logo">
        <div class="ic"><svg width="22" height="13" viewBox="0 0 48 26" aria-label="Clarity"><path d="M2 8 q6 -7 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#eafcfb" stroke-width="3" stroke-linecap="round"/><path d="M2 17 q6 -7 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#aef2ee" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg></div>
        <div><div class="ti serif">Clarity</div><div class="sub">Pool Co-Pilot</div></div>
      </div>
      <button class="gear mono" id="gearBtn">⚙ <span id="gLabel">15,000g</span></button>
    </div>
    <div id="setup" style="display:none"></div>
    <div class="tabwrap"><div class="tabs" id="tabs"></div></div>
  </div></div>

  <div class="body" id="body"></div>

  <div class="inbar" id="inbar">
    <div class="inbarin" style="flex-direction:column;align-items:stretch">
      <div id="attachPreview"></div>
      <div style="display:flex;gap:8px;align-items:flex-end">
      <label class="photobtn" id="camBtn" title="Take a photo">📷</label>
      <label class="photobtn" id="uploadBtn" title="Upload a photo">📁</label>
      <input id="fileIn" type="file" accept="image/*" capture="environment" style="display:none">
      <input id="uploadIn" type="file" accept="image/*" style="display:none">
      <div class="txtwrap">
        <textarea id="msgIn" rows="1" placeholder="Ask anything about your pool…"></textarea>
        <button class="send" id="sendBtn">↑</button>
      </div>
      </div>
    </div>
    <div class="foot">📷 snap or 📁 upload a photo · Enter to send · <span class="ver-tag">v3.1.4</span></div>
  </div>
</div>

<!-- task editor -->
<div class="scrim" id="taskScrim">
  <div class="modal">
    <div class="grab"></div>
    <h2 id="tmTitle">New task</h2>
    <div class="field"><label>Task</label><input id="tName" placeholder="e.g. Backwash the filter"></div>
    <div class="row2">
      <div class="field"><label>Frequency label</label><input id="tFreq" placeholder="Weekly"></div>
      <div class="field"><label>Every (days)</label><input id="tInt" type="number" inputmode="numeric" min="1" value="7"></div>
    </div>
    <div class="mact">
      <button class="ghost" id="tDelete" style="display:none;flex:0 0 auto;padding-left:18px;padding-right:18px;color:var(--coral)">Delete</button>
      <button class="ghost" onclick="closeScrim('taskScrim')">Cancel</button>
      <button class="solid" id="tSave">Save</button>
    </div>
  </div>
</div>

<script>
const IDEAL={
  chlorine:{min:1,max:3,unit:'ppm',label:'Free Chlorine',short:'FC'},
  totalChlorine:{min:1,max:3,unit:'ppm',label:'Total Chlorine',short:'TC'},
  ph:{min:7.2,max:7.6,unit:'',label:'pH',short:'pH'},
  alkalinity:{min:80,max:120,unit:'ppm',label:'Total Alkalinity',short:'Alk'},
  hardness:{min:200,max:400,unit:'ppm',label:'Calcium Hardness',short:'Hard'},
  cyanuric:{min:30,max:50,unit:'ppm',label:'Cyanuric Acid',short:'CYA'},
};
const KEYS=Object.keys(IDEAL);
const color=(v,k)=>{const r=IDEAL[k];if(v==null)return'#5a7a8a';if(v<r.min)return'#5bc6dc';if(v>r.max)return'#ec8a72';return'#5cc8a0';};
const statusOf=(v,k)=>{const r=IDEAL[k];if(v==null)return null;return v<r.min?'LOW':v>r.max?'HIGH':'OK';};

function doseAdvice(read,gal){
  const f=gal/10000, out=[];
  const cl=read.chlorine;
  if(cl!=null&&cl<IDEAL.chlorine.min){const oz=((IDEAL.chlorine.max-cl)*2*f).toFixed(1);
    out.push({nm:'Add Chlorine',sev:'low',amt:`${oz} oz cal-hypo (or 1 dose liquid shock)`,
      ex:`Free chlorine is ${cl} ppm — below the ${IDEAL.chlorine.min} ppm minimum. Add chlorine and retest in 4 hrs.`});}
  else if(cl!=null&&cl>IDEAL.chlorine.max){out.push({nm:'Lower Chlorine',sev:'high',amt:`Stop chlorinating · wait`,
      ex:`Free chlorine ${cl} ppm is high. Hold off adding more and let sunlight bring it down before swimming.`});}
  const tc=read.totalChlorine;
  if(tc!=null&&cl!=null&&(tc-cl)>0.5){const oz=(10*f).toFixed(0);
    out.push({nm:'Shock (chloramines)',sev:'high',amt:`${oz} oz cal-hypo / shock`,
      ex:`Combined chlorine is ${(tc-cl).toFixed(1)} ppm (total ${tc} − free ${cl}). Above 0.5 ppm means chloramines — the stuff that smells "chlorine-y" and stings eyes. Shock the pool to break them up.`});}
  const ph=read.ph;
  if(ph!=null&&ph<IDEAL.ph.min){const oz=((IDEAL.ph.min-ph)*48*f).toFixed(0);
    out.push({nm:'Raise pH',sev:'low',amt:`${oz} oz soda ash (pH up)`,
      ex:`pH ${ph} is acidic. Add soda ash gradually with the pump running, retest after an hour.`});}
  else if(ph!=null&&ph>IDEAL.ph.max){const oz=((ph-IDEAL.ph.max)*12*f).toFixed(0);
    out.push({nm:'Lower pH',sev:'high',amt:`${oz} fl oz muriatic acid`,
      ex:`pH ${ph} is high — scaling and cloudy water risk. Add acid slowly into a return jet, never the skimmer.`});}
  const al=read.alkalinity;
  if(al!=null&&al<IDEAL.alkalinity.min){const lb=(((IDEAL.alkalinity.min-al)/10)*1.5*f).toFixed(1);
    out.push({nm:'Raise Alkalinity',sev:'low',amt:`${lb} lb baking soda`,
      ex:`Alkalinity ${al} ppm is low, making pH unstable. Raise it before chasing pH.`});}
  else if(al!=null&&al>IDEAL.alkalinity.max){out.push({nm:'Lower Alkalinity',sev:'high',amt:`Add acid + aerate`,
      ex:`Alkalinity ${al} ppm is high. Add muriatic acid in stages and aerate; this also nudges pH down.`});}
  const hd=read.hardness;
  if(hd!=null&&hd<IDEAL.hardness.min){const lb=(((IDEAL.hardness.min-hd)/10)*1.25*f).toFixed(1);
    out.push({nm:'Raise Hardness',sev:'low',amt:`${lb} lb calcium chloride`,
      ex:`Calcium hardness ${hd} ppm is low — water may corrode surfaces. Add calcium chloride.`});}
  else if(hd!=null&&hd>IDEAL.hardness.max){out.push({nm:'Lower Hardness',sev:'high',amt:`Partial drain & refill`,
      ex:`Hardness ${hd} ppm is high (scaling risk). Dilute by draining ~25% and refilling with fresh water.`});}
  const cy=read.cyanuric;
  if(cy!=null&&cy<IDEAL.cyanuric.min){const oz=(((IDEAL.cyanuric.min-cy)/10)*13*f).toFixed(0);
    out.push({nm:'Add Stabilizer',sev:'low',amt:`${oz} oz cyanuric acid`,
      ex:`CYA ${cy} ppm is low — chlorine burns off fast in sun. Add stabilizer (dissolves slowly).`});}
  else if(cy!=null&&cy>IDEAL.cyanuric.max){out.push({nm:'Lower Stabilizer',sev:'high',amt:`Partial drain & refill`,
      ex:`CYA ${cy} ppm is high — it weakens chlorine. The only real fix is diluting with fresh water.`});}
  return out;
}

const store={
  get:k=>{try{return JSON.parse(localStorage.getItem('clarity-'+k))}catch(e){return null}},
  set:(k,v)=>localStorage.setItem('clarity-'+k,JSON.stringify(v)),
  del:k=>localStorage.removeItem('clarity-'+k),
};
let S={
  gallons: store.get('gallons')||15000,
  history: store.get('history')||[],
  tasks: store.get('tasks')||defaultTasks(),
  poolNotes: store.get('poolNotes')||'',
  poolProfile: store.get('poolProfile')||{
    type:null, surface:null, filter:null, climate:null,
    sun:null, water:null, usage:null, equipment:[]
  },
  messages:[{role:'assistant',content:"Hi! I'm Clarity, your personal pool co-pilot.\n\nI learn your pool's patterns over time and give advice specific to YOUR pool — not generic tips.\n\n**First time?** Tap ⚙ to set up your pool profile so I can give you personalized advice from day one.\n\n📷 To scan, dip the strip, then slide it into the channel on the LEFT EDGE of the AquaChek reference card and photograph the whole card in even, indirect light (no flash). Reading the strip against the card's swatches in the same shot is how I stay accurate. I can also look at algae, cloudy water, or equipment. If a pad is unclear I'll say so rather than guess."}],
  tab:'dash', thinking:false, setupOpen:false, editTask:null,
  _pendingImage:null,
};
function defaultTasks(){
  const day=864e5, now=Date.now();
  return [
    {id:1,t:'Test water chemistry',freq:'Weekly',int:7,last:now-5*day,done:false},
    {id:2,t:'Skim surface & empty baskets',freq:'2–3× weekly',int:3,last:now-day,done:false},
    {id:3,t:'Brush walls & vacuum',freq:'Weekly',int:7,last:now-8*day,done:false},
    {id:4,t:'Clean skimmer & pump basket',freq:'Weekly',int:7,last:now-4*day,done:false},
    {id:5,t:'Shock the pool',freq:'Bi-weekly',int:14,last:now-12*day,done:false},
    {id:6,t:'Check & backwash filter',freq:'Monthly',int:30,last:now-20*day,done:false},
    {id:7,t:'Inspect equipment & water level',freq:'Weekly',int:7,last:now-6*day,done:false},
  ];
}
function persist(){store.set('gallons',S.gallons);store.set('history',S.history);store.set('tasks',S.tasks);store.set('poolNotes',S.poolNotes);store.set('poolProfile',S.poolProfile);}

const $=id=>document.getElementById(id);
const TABS=[['dash','Dashboard'],['chat','Chat'],['chem','Chemistry'],['history','History'],['schedule','Schedule']];

const WAVE=`<svg class="wv" viewBox="0 0 120 40" preserveAspectRatio="none"><path d="M0 12 Q15 3 30 12 T60 12 T90 12 T120 12 V40 H0 Z" fill="#5bc6dc"/><path d="M0 12 Q15 3 30 12 T60 12 T90 12 T120 12" fill="none" stroke="#aef2ee" stroke-width="2" opacity=".8"/></svg>`;
const AV=`<svg width="20" height="20" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 6C20 6 9 17 9 25a11 11 0 0 0 22 0C31 17 20 6 20 6Z" fill="#eafcfb"/><circle cx="15" cy="20" r="3.6" fill="#cdeff2" stroke="#0d7390" stroke-width="1.6"/><circle cx="25" cy="20" r="3.6" fill="#cdeff2" stroke="#0d7390" stroke-width="1.6"/><path d="M18.6 20h2.8" stroke="#0d7390" stroke-width="1.6"/><path d="M14 27q6 3 12 0" fill="none" stroke="#0d7390" stroke-width="1.8" stroke-linecap="round"/></svg>`;
function renderTabs(){
  $('tabs').innerHTML=TABS.map(([k,l])=>{
    const c=k==='history'&&S.history.length?` ${S.history.length}`:'';
    const on=S.tab===k;
    return `<button class="tab ${on?'on':''}" data-tab="${k}">${on?WAVE:''}<span>${l}${c}</span></button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  $('gLabel').textContent=S.gallons.toLocaleString()+'g';
  $('inbar').style.display=S.tab==='chat'?'block':'none';
}
function renderSetup(){
  const el=$('setup');
  if(!S.setupOpen){el.style.display='none';return;}
  el.style.display='block';
  const P=S.poolProfile;
  const profileComplete=[P.type,P.surface,P.filter,P.climate,P.sun,P.water,P.usage].filter(Boolean).length;
  const pct=Math.round(profileComplete/7*100);
  const chipSet=(field,options,multi)=>options.map(o=>{
    const on=multi?(P[field]||[]).includes(o):P[field]===o;
    return `<button class="chip ${on?'on':''}" data-field="${field}" data-val="${o}" data-multi="${multi||''}">${o}</button>`;
  }).join('');

  el.innerHTML=`
    <div class="setup">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-size:14px;font-weight:600;letter-spacing:.3px">🏊 Pool Profile</div>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:10px;color:${pct===100?'var(--green)':'var(--mut2)'};font-family:'DM Mono',monospace">${pct}%</div>
          <button id="closeSetup" style="background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);font-size:14px;cursor:pointer;padding:2px 8px;transition:.2s">✕</button>
        </div>
      </div>
      ${pct<100?'<div class="hint" style="margin-bottom:14px;color:var(--aqua)">Fill out your pool profile so Clarity can give advice specific to YOUR pool — not generic tips.</div>':''}

      <div class="lab">Pool size (gallons)</div>
      <div class="chips">${[5000,8000,10000,12000,15000,20000,25000,30000].map(g=>
        `<button class="chip ${S.gallons===g?'on':''}" data-g="${g}">${g>=1000?(g/1000)+'k':g}</button>`).join('')}</div>

      <div class="lab">Sanitizer type</div>
      <div class="chips">${chipSet('type',['Chlorine','Salt','Mineral','Bromine'])}</div>

      <div class="lab">Surface</div>
      <div class="chips">${chipSet('surface',['Plaster','Vinyl','Fiberglass','Pebble/Aggregate'])}</div>

      <div class="lab">Filter</div>
      <div class="chips">${chipSet('filter',['Sand','Cartridge','DE'])}</div>

      <div class="lab">Climate</div>
      <div class="chips">${chipSet('climate',['Hot & Dry','Hot & Humid','Temperate','Cold/Seasonal'])}</div>

      <div class="lab">Sun exposure</div>
      <div class="chips">${chipSet('sun',['Full Sun','Partial Shade','Mostly Shade'])}</div>

      <div class="lab">Water source</div>
      <div class="chips">${chipSet('water',['City/Municipal','Well'])}</div>

      <div class="lab">Usage</div>
      <div class="chips">${chipSet('usage',['Daily','Few times/week','Weekends only','Seasonal'])}</div>

      <div class="lab">Equipment <span style="color:var(--mut2);text-transform:none;letter-spacing:0">(select all that apply)</span></div>
      <div class="chips">${chipSet('equipment',['Heater','Salt Cell','Automation','Cover','UV/Ozone','Robot Cleaner'],true)}</div>

      <div style="margin-top:16px"><div class="lab">Pool notes & conditions</div>
      <textarea id="poolNotesInput" style="width:100%;min-height:70px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--txt);font-size:13px;font-family:inherit;resize:vertical;line-height:1.5" placeholder="Anything else Clarity should know — e.g. 'has a slow leak', 'recently replastered', 'lots of trees nearby'…">${esc(S.poolNotes)}</textarea>
      <div class="hint">These notes are sent to Clarity with every message so it understands your pool's ongoing situation.</div></div>

      <div style="margin-top:12px;font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace;text-align:right;letter-spacing:1px">Clarity v3.1.4</div>
    </div>`;

  // Gallon chips
  el.querySelectorAll('.chip[data-g]').forEach(c=>c.onclick=()=>{S.gallons=+c.dataset.g;persist();renderSetup();renderTabs();render()});

  // Profile chips
  el.querySelectorAll('.chip[data-field]').forEach(c=>c.onclick=()=>{
    const f=c.dataset.field, v=c.dataset.val, multi=c.dataset.multi;
    if(multi){
      const arr=P[f]||[];
      if(arr.includes(v))P[f]=arr.filter(x=>x!==v);
      else P[f]=[...arr,v];
    }else{
      P[f]=P[f]===v?null:v; // tap again to deselect
    }
    persist();renderSetup();
  });

  // Notes
  const notesEl=$('poolNotesInput');
  if(notesEl)notesEl.onblur=()=>{S.poolNotes=notesEl.value.trim();persist();};

  // Close button
  const closeBtn=$('closeSetup');
  if(closeBtn)closeBtn.onclick=()=>{S.setupOpen=false;renderSetup();};
}

function render(){
  renderTabs();renderSetup();
  const b=$('body');
  if(S.tab==='dash')renderDash(b);
  else if(S.tab==='chat')renderChat(b);
  else if(S.tab==='chem')renderChem(b);
  else if(S.tab==='history')renderHistory(b);
  else if(S.tab==='schedule')renderSchedule(b);
}

function gaugeHTML(v,k){
  const r=IDEAL[k],span=r.max-r.min,pmin=r.min-span*.4,pmax=r.max+span*.4;
  const iL=(r.min-pmin)/(pmax-pmin)*100,iW=(r.max-r.min)/(pmax-pmin)*100;
  const p=v!=null?Math.max(0,Math.min(100,(v-pmin)/(pmax-pmin)*100)):null;
  const c=color(v,k);
  return `<div class="gauge"><div class="ideal" style="left:${iL}%;width:${iW}%"></div>
    ${p!=null?`<div class="pin" style="left:${p}%;background:${c};box-shadow:0 0 8px ${c}"></div>`:''}</div>`;
}

function parseReadings(text){
  const m=text.match(/<!--READINGS:(.*?)-->/s);
  if(!m)return null;
  try{
    const data=JSON.parse(m[1]);
    const clean=text.replace(/\n?<!--READINGS:.*?-->/s,'').trim();
    return{clean,readings:data};
  }catch(e){return null;}
}

function renderResultsCard(readings,msgIdx){
  const doses=doseAdvice(readings,S.gallons);
  const saved=S._savedMsgs&&S._savedMsgs.has(msgIdx);
  let h=`<div class="rcard"><div class="rcard-hdr"><span class="rcard-icon">📊</span><span class="rcard-title">Test Strip Results</span></div>`;
  h+=`<div class="rcard-grid">`;
  KEYS.forEach(k=>{
    const v=readings[k];
    const c=color(v,k);
    const st=statusOf(v,k);
    const stColor=st==='OK'?'var(--green)':st==='HIGH'?'var(--coral)':st==='LOW'?'var(--aqua)':'var(--mut2)';
    h+=`<div class="rcard-param"><div class="rp-label">${IDEAL[k].short}</div>`;
    h+=`<div class="rp-value" style="color:${v!=null?c:'rgba(255,255,255,.15)'}">${v!=null?v:'—'}</div>`;
    if(st)h+=`<span class="rp-badge" style="color:${stColor};background:${stColor}1a">${st}</span>`;
    h+=`${gaugeHTML(v,k)}</div>`;
  });
  h+=`</div>`;
  if(doses.length===0){
    h+=`<div class="rcard-ok">✨ Everything is in range — water is balanced!</div>`;
  } else {
    h+=`<div style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:'DM Mono',monospace">Recommended · ${S.gallons.toLocaleString()} gal</div>`;
    doses.forEach(d=>{
      const c=d.sev==='high'?'var(--coral)':'var(--aqua)';
      h+=`<div class="rcard-dose"><div class="rd-top"><span class="rd-name">${d.nm}</span>`;
      h+=`<span class="rd-badge" style="color:${c};background:${c}1a">${d.sev==='high'?'REDUCE':'ADD'}</span></div>`;
      h+=`<div class="rd-amt">${d.amt}</div><div class="rd-ex">${d.ex}</div></div>`;
    });
  }
  h+=`<button class="rcard-save" data-msgidx="${msgIdx}" ${saved?'disabled':''}>${saved?'✓ Saved to History':'💾 Save to History'}</button>`;
  h+=`</div>`;
  return h;
}

function buildSparkline(key,w,h){
  const pts=S.history.slice(0,15).reverse().filter(e=>e[key]!=null);
  if(pts.length<2)return'';
  const vals=pts.map(e=>e[key]);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const range=mx-mn||1;
  const r=IDEAL[key];
  // ideal band
  const y1=h-((r.max-mn)/range)*h;
  const y2=h-((r.min-mn)/range)*h;
  let svg=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">`;
  svg+=`<rect x="0" y="${Math.max(0,y1)}" width="${w}" height="${Math.min(h,y2)-Math.max(0,y1)}" fill="rgba(92,200,160,.12)" rx="2"/>`;
  const points=vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w;
    const y=h-((v-mn)/range)*h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  svg+=`<polyline points="${points.join(' ')}" fill="none" stroke="var(--aqua)" stroke-width="1.5" stroke-linejoin="round"/>`;
  // dots on last point
  const last=points[points.length-1];
  svg+=`<circle cx="${last.split(',')[0]}" cy="${last.split(',')[1]}" r="2.5" fill="var(--aqua)"/>`;
  svg+=`</svg>`;
  return svg;
}

function renderDash(b){
  const latest=S.history[0];
  const hasData=!!latest;

  // Health score
  let score=0,measured=0,swimStatus='unknown';
  if(hasData){
    KEYS.forEach(k=>{
      if(latest[k]!=null){
        measured++;
        const st=statusOf(latest[k],k);
        if(st==='OK')score++;
      }
    });
    score=measured?Math.round((score/measured)*100):0;

    // Swim safety based on FC and pH
    const fc=latest.chlorine,ph=latest.ph;
    if(fc!=null&&fc<0.5)swimStatus='danger';
    else if(ph!=null&&(ph<6.8||ph>8.0))swimStatus='danger';
    else if(fc!=null&&fc<1)swimStatus='caution';
    else if(ph!=null&&(ph<7.0||ph>7.8))swimStatus='caution';
    else if(fc!=null)swimStatus='safe';
  }

  // Days since last test
  let daysSince='—';
  if(hasData){
    const diff=Math.floor((Date.now()-latest.timestamp)/864e5);
    daysSince=diff===0?'Today':diff===1?'Yesterday':diff+' days ago';
  }

  const swimIcon=swimStatus==='safe'?'🏊':swimStatus==='caution'?'⚠️':swimStatus==='danger'?'🚫':'❓';
  const swimLabel=swimStatus==='safe'?'Safe to swim':swimStatus==='caution'?'Use caution':swimStatus==='danger'?'Do not swim':'No data yet';
  const swimColor=swimStatus==='safe'?'var(--green)':swimStatus==='caution'?'#f0c040':swimStatus==='danger'?'var(--coral)':'var(--mut2)';
  const scoreColor=score>=80?'var(--green)':score>=50?'#f0c040':'var(--coral)';

  let html=`<div class="bin">`;

  // Top row: Health Score + Swim Status
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
    <div class="formcard" style="text-align:center;padding:18px 12px;margin:0">
      <div style="font-size:36px;font-weight:700;color:${hasData?scoreColor:'var(--mut2)'};font-family:'Playfair Display',serif;line-height:1">${hasData?score:'—'}</div>
      <div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px">Pool Health</div>
    </div>
    <div class="formcard" style="text-align:center;padding:18px 12px;margin:0">
      <div style="font-size:30px;line-height:1">${swimIcon}</div>
      <div style="font-size:11px;color:${swimColor};font-weight:600;margin-top:6px">${swimLabel}</div>
    </div>
  </div>`;

  // Last tested
  html+=`<div class="formcard" style="display:flex;justify-content:space-between;align-items:center;padding:13px 16px;margin-bottom:12px">
    <div><div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase">Last tested</div>
      <div style="font-size:14px;margin-top:3px;font-weight:500">${daysSince}</div></div>
    <button class="chip on" onclick="S.tab='chat';render()">Test now →</button>
  </div>`;

  if(hasData){
    // Current readings
    html+=`<div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;margin-top:16px">Current Readings</div>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">`;
    KEYS.forEach(k=>{
      const v=latest[k];
      const c=color(v,k);
      const r=IDEAL[k];
      const st=statusOf(v,k);
      const badge=st==='OK'?'':st==='LOW'?' ↓':' ↑';
      html+=`<div class="formcard" style="text-align:center;padding:12px 8px;margin:0">
        <div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1px">${r.short}</div>
        <div style="font-size:22px;font-weight:700;color:${c};font-family:'Playfair Display',serif;margin:4px 0">${v??'—'}${badge}</div>
        <div style="font-size:9px;color:var(--mut2)">${r.min}–${r.max}${r.unit?' '+r.unit:''}</div>
      </div>`;
    });
    html+=`</div>`;

    // Sparklines for key params
    const sparkKeys=['chlorine','ph','alkalinity'];
    const sparkData=sparkKeys.filter(k=>S.history.filter(e=>e[k]!=null).length>=2);
    if(sparkData.length){
      html+=`<div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">Trends (last 15 tests)</div>`;
      sparkData.forEach(k=>{
        const r=IDEAL[k];
        const lastVal=latest[k];
        html+=`<div class="formcard" style="padding:12px 14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:12px;font-weight:500">${r.label}</span>
            <span style="font-size:13px;font-weight:600;color:${color(lastVal,k)}">${lastVal??'—'} ${r.unit}</span>
          </div>
          ${buildSparkline(k,280,40)}
        </div>`;
      });
    }

    // Recent actions timeline
    const withActions=S.history.filter(e=>e.action).slice(0,5);
    if(withActions.length){
      html+=`<div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;margin-top:16px">Recent Actions</div>`;
      withActions.forEach(e=>{
        const d=new Date(e.timestamp);
        const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
        html+=`<div style="display:flex;gap:10px;align-items:baseline;margin-bottom:6px;font-size:12px">
          <span class="mono" style="color:var(--mut2);font-size:10px;min-width:45px">${ds}</span>
          <span style="color:var(--aqua)">${e.action}</span>
          ${e.actionAmt?`<span style="color:var(--mut)">· ${e.actionAmt}</span>`:''}
          ${e.notes?`<span style="color:var(--mut2);font-style:italic">· ${e.notes}</span>`:''}
        </div>`;
      });
    }

    // Computed insights
    if(S.history.length>=3){
      const dashInsights=[];

      // FC decay rate
      const fcP=[];
      for(let i=0;i<S.history.length-1;i++){
        const cur=S.history[i],prev=S.history[i+1];
        if(cur.chlorine!=null&&prev.chlorine!=null&&prev.action!=='Added Chlorine'&&prev.action!=='Shocked'){
          const days=(prev.timestamp-cur.timestamp)/864e5;
          if(days>0&&days<14)fcP.push((prev.chlorine-cur.chlorine)/days);
        }
      }
      if(fcP.length>=2){
        const avg=(fcP.reduce((a,b)=>a+b,0)/fcP.length).toFixed(2);
        dashInsights.push({icon:'📉',text:`FC drops ~${Math.abs(avg)} ppm/day`});
      }

      // pH trend
      const phV=S.history.filter(e=>e.ph!=null).slice(0,10);
      if(phV.length>=3){
        const recent=phV.slice(0,3).reduce((a,e)=>a+e.ph,0)/3;
        const older=phV.slice(-3).reduce((a,e)=>a+e.ph,0)/Math.min(3,phV.slice(-3).length);
        const drift=recent-older;
        if(Math.abs(drift)>0.1)dashInsights.push({icon:drift>0?'📈':'📉',text:`pH trending ${drift>0?'up':'down'} (${older.toFixed(1)} → ${recent.toFixed(1)})`});
        else dashInsights.push({icon:'➡️',text:`pH stable (~${recent.toFixed(1)})`});
      }

      // Test frequency
      const gaps=[];
      for(let i=0;i<Math.min(S.history.length-1,10);i++){
        gaps.push((S.history[i].timestamp-S.history[i+1].timestamp)/864e5);
      }
      if(gaps.length){
        const avgG=(gaps.reduce((a,b)=>a+b,0)/gaps.length).toFixed(0);
        dashInsights.push({icon:'🗓️',text:`Testing every ~${avgG} days`});
      }

      // Recurring issues
      const ic={};
      S.history.slice(0,15).forEach(e=>{
        KEYS.forEach(k=>{
          const st=statusOf(e[k],k);
          if(st&&st!=='OK'){ic[IDEAL[k].short+' '+st]=(ic[IDEAL[k].short+' '+st]||0)+1;}
        });
      });
      const rec=Object.entries(ic).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]);
      if(rec.length)dashInsights.push({icon:'🔁',text:`Recurring: ${rec.map(([k,c])=>k+' ('+c+'x)').join(', ')}`});

      // Next test prediction
      if(fcP.length>=2){
        const avgDecay=Math.abs(fcP.reduce((a,b)=>a+b,0)/fcP.length);
        const currentFc=latest.chlorine;
        if(currentFc!=null&&avgDecay>0){
          const daysToMin=((currentFc-IDEAL.chlorine.min)/avgDecay).toFixed(0);
          if(daysToMin>0&&daysToMin<14)dashInsights.push({icon:'⏰',text:`FC reaches minimum in ~${daysToMin} days — test by then`});
        }
      }

      if(dashInsights.length){
        html+=`<div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;margin-top:16px">Insights</div>`;
        html+=`<div class="formcard" style="padding:12px 14px;margin-bottom:8px">`;
        dashInsights.forEach(ins=>{
          html+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px">
            <span>${ins.icon}</span><span style="color:var(--txt)">${ins.text}</span>
          </div>`;
        });
        html+=`</div>`;
      }
    }

    // Smart suggested prompts (context-aware)
    const prompts=[];
    if(latest){
      const daysSinceNum=Math.floor((Date.now()-latest.timestamp)/864e5);
      if(daysSinceNum>=3)prompts.push('Should I test today?');
      const fc=latest.chlorine,ph=latest.ph;
      if(fc!=null&&fc<IDEAL.chlorine.min)prompts.push('How do I raise my chlorine?');
      if(ph!=null&&ph>IDEAL.ph.max)prompts.push('Why does my pH keep rising?');
      if(ph!=null&&ph<IDEAL.ph.min)prompts.push('How do I raise my pH?');
      const alk=latest.alkalinity;
      if(alk!=null&&alk<IDEAL.alkalinity.min)prompts.push('My alkalinity is low — what should I do?');
      if(S.history.length>=5)prompts.push('How is my pool doing overall?');
      if(S.history.length>=3)prompts.push('What patterns do you see?');
    }
    if(!prompts.length)prompts.push('What should I know about pool maintenance?','How often should I test?');
    html+=`<div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;margin-top:16px">Ask Clarity</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${prompts.slice(0,4).map(q=>
        `<button class="chip dash-prompt" data-q="${esc(q)}">${q}</button>`).join('')}</div>`;

    // Export + Manual buttons
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <button class="btn" id="exportBtn" style="background:var(--panel2);border:1px solid var(--line);font-size:11px;color:var(--aqua);padding:12px 10px">📋 Export Report</button>
      <button class="btn" id="manualBtn" style="background:var(--panel2);border:1px solid var(--line);font-size:11px;color:var(--aqua);padding:12px 10px">📖 Pool Manual</button>
    </div>`;

  } else {
    html+=`<div class="empty"><div class="e">📊</div>
      <div class="mono" style="letter-spacing:1px;text-transform:uppercase;font-size:12px">No data yet</div>
      <div style="font-size:12px;margin-top:6px">Test your water to see your dashboard. Tap <strong>Chat</strong> to scan a strip — slide it into the channel on the left edge of the AquaChek card and photograph the whole card — or <strong>Chemistry</strong> to enter readings.</div></div>`;
  }

  // Onboarding nudge if profile incomplete
  const P=S.poolProfile;
  const profileDone=[P.type,P.surface,P.filter,P.climate,P.sun,P.water,P.usage].filter(Boolean).length;
  if(profileDone<7){
    html+=`<div class="formcard" style="padding:13px 16px;margin-top:12px;border:1px solid var(--line2)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;font-weight:500;color:var(--aqua)">Complete your pool profile</div>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${profileDone}/7 fields · Better advice with a complete profile</div></div>
        <button class="chip on" id="nudgeSetup" style="font-size:11px">Set up →</button>
      </div>
    </div>`;
  }

  html+=`</div>`;
  b.innerHTML=html;

  // Smart prompt clicks → go to chat and send
  b.querySelectorAll('.dash-prompt').forEach(btn=>{
    btn.onclick=()=>{S.tab='chat';render();setTimeout(()=>sendMessage(btn.dataset.q),100);};
  });

  // Export report
  if($('exportBtn'))$('exportBtn').onclick=()=>{
    let report='CLARITY POOL REPORT\n';
    report+='Generated: '+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'\n';
    report+='═══════════════════════\n\n';
    report+='POOL PROFILE\n';
    report+='Pool size: '+S.gallons.toLocaleString()+' gallons\n';
    const P=S.poolProfile;
    if(P.type)report+='Sanitizer: '+P.type+'\n';
    if(P.surface)report+='Surface: '+P.surface+'\n';
    if(P.filter)report+='Filter: '+P.filter+'\n';
    if(P.climate)report+='Climate: '+P.climate+'\n';
    if(P.sun)report+='Sun: '+P.sun+'\n';
    if(P.water)report+='Water source: '+P.water+'\n';
    if(P.usage)report+='Usage: '+P.usage+'\n';
    if(P.equipment&&P.equipment.length)report+='Equipment: '+P.equipment.join(', ')+'\n';
    if(S.poolNotes)report+='Notes: '+S.poolNotes+'\n';
    report+='\nTEST HISTORY (last 20)\n';
    S.history.slice(0,20).forEach(e=>{
      const d=new Date(e.timestamp);
      const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      report+='\n'+ds+'\n';
      KEYS.forEach(k=>{
        if(e[k]!=null)report+='  '+IDEAL[k].label+': '+e[k]+' '+IDEAL[k].unit+' ('+statusOf(e[k],k)+')\n';
      });
      if(e.action)report+='  Action: '+e.action+(e.actionAmt?' · '+e.actionAmt:'')+'\n';
      if(e.notes)report+='  Notes: '+e.notes+'\n';
    });
    navigator.clipboard.writeText(report).then(()=>{
      $('exportBtn').textContent='✓ Copied!';
      setTimeout(()=>{$('exportBtn').textContent='📋 Export Report';},2000);
    }).catch(()=>{
      const blob=new Blob([report],{type:'text/plain'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='clarity-pool-report.txt';a.click();
    });
  };

  // Pool manual button → go to chat and ask Claude
  if($('manualBtn'))$('manualBtn').onclick=()=>{
    S.tab='chat';render();
    setTimeout(()=>sendMessage('Based on everything you know about my pool — profile, history, patterns, and current readings — write me a comprehensive Pool Maintenance Manual. Include: my pool specs, ideal ranges for my setup, my typical maintenance schedule, what chemicals I use and how much, seasonal tips for my climate, common issues I run into and how to fix them, and any patterns you\'ve noticed. Make it specific to MY pool, not generic advice.'),100);
  };

  // Onboarding nudge
  if($('nudgeSetup'))$('nudgeSetup').onclick=()=>{S.setupOpen=true;renderSetup();};
}

function renderChat(b){
  const quick=["How often should I test my water?","My water looks cloudy — what do I check?","How do I shock my pool?","Send me a photo of your test strip and I'll read it"];
  let html='<div class="bin">';
  if(!S._savedMsgs)S._savedMsgs=new Set();
  S.messages.forEach((m,idx)=>{
    const u=m.role==='user';
    const imgHtml=m._image?`<img class="msg-img" src="${m._image}">`:'';
    const sentBadge=m._imageSize?`<div style="font-size:9px;color:var(--green);margin-top:4px;font-family:'DM Mono',monospace">📷 Image sent (${Math.round(m._imageSize/1024)}KB)</div>`:'';
    let displayText=m.content;
    let cardHtml='';
    if(!u){
      const parsed=parseReadings(m.content);
      if(parsed){
        displayText=parsed.clean;
        m._readings=parsed.readings;
        cardHtml=renderResultsCard(parsed.readings,idx);
      }
    }
    html+=`<div class="msg ${u?'u':''}">${u?'':`<div class="av">${AV}</div>`}<div class="bub ${u?'u':'a'}">${imgHtml}${esc(displayText)}${sentBadge}${cardHtml}</div></div>`;
  });
  if(S.thinking)html+=`<div class="msg"><div class="av">${AV}</div><div class="dots"><i style="animation-delay:0s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.4s"></i></div></div>`;
  if(S.messages.length===1&&!S.thinking){
    html+=`<div class="sugg"><div class="h">Suggested questions</div>${quick.map(q=>`<button class="sg" data-q="${esc(q)}">${q}</button>`).join('')}</div>`;
  }
  html+='<div id="bottom"></div></div>';
  b.innerHTML=html;
  b.querySelectorAll('.sg').forEach(s=>s.onclick=()=>sendMessage(s.dataset.q));
  b.querySelectorAll('.rcard-save').forEach(btn=>{
    if(btn.disabled)return;
    btn.onclick=(e)=>{
      e.stopPropagation();
      const mi=+btn.dataset.msgidx;
      const msg=S.messages[mi];
      if(msg&&msg._readings){
        logReading(msg._readings);
        S._savedMsgs.add(mi);
        render();
      }
    };
  });
  $('bottom')?.scrollIntoView({behavior:'smooth'});
}

function renderChem(b){
  const r=S._draft||{};
  const last=S.history[0];
  let html=`<div class="bin"><div class="formcard">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px">
      <h3 style="margin:0">🧪 Enter your readings</h3>
      <button class="add" id="pullBtn" style="padding:6px 11px;font-size:11.5px${last?'':';opacity:.4;cursor:default;border-color:var(--line)'}" ${last?'':'title="No saved tests yet"'}>↧ Last test</button>
    </div>`;
  KEYS.forEach(k=>{
    const i=IDEAL[k];
    html+=`<div class="inrow"><label>${i.label} <span class="rng">${i.min}–${i.max}${i.unit}</span></label>
      <input data-k="${k}" type="number" inputmode="decimal" step="any" value="${r[k]??''}" placeholder="–"></div>`;
  });
  html+=`<button class="btn go" id="calcBtn">Calculate dosing</button>
    <button class="btn" id="directLogBtn" style="background:var(--panel2);border:1px solid var(--line);margin-top:8px;width:100%;font-size:13px;color:var(--aqua)">💾 Save readings to history</button></div>`;
  if(S._doses){
    if(S._doses.length===0){
      html+=`<div class="formcard" style="text-align:center"><div style="font-size:28px;margin-bottom:8px">✨</div>
        <div class="serif" style="font-size:19px;color:var(--green)">Water is balanced</div>
        <div style="font-size:12px;color:var(--mut);margin-top:6px">Everything is in range. Nothing to add right now.</div></div>`;
    } else {
      html+=`<div style="font-size:10px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin:4px 0 11px" class="mono">Recommended for ${S.gallons.toLocaleString()} gal</div>`;
      S._doses.forEach(d=>{
        const c=d.sev==='high'?'var(--coral)':'var(--aqua)';
        html+=`<div class="dose"><div class="top"><span class="nm">${d.nm}</span>
          <span class="badge" style="color:${c};background:${c}1f">${d.sev==='high'?'REDUCE':'ADD'}</span></div>
          <div class="amt">${d.amt}</div><div class="ex">${d.ex}</div></div>`;
      });
      html+=`<button class="btn go" id="logBtn" style="background:var(--panel2);margin-top:4px">＋ Save these readings to history</button>`;
    }
  }
  html+='</div>';
  b.innerHTML=html;
  b.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=e=>{S._draft=S._draft||{};const val=e.target.value;S._draft[e.target.dataset.k]=val===''?null:parseFloat(val)});
  if(last&&$('pullBtn'))$('pullBtn').onclick=()=>{S._draft={};KEYS.forEach(k=>S._draft[k]=last[k]??null);S._doses=doseAdvice(S._draft,S.gallons);render()};
  $('calcBtn').onclick=()=>{const d=S._draft||{};S._doses=doseAdvice(d,S.gallons);render()};
  $('directLogBtn').onclick=()=>{const d=S._draft||{};const hasAny=KEYS.some(k=>d[k]!=null);if(!hasAny){alert('Enter at least one reading first.');return;}logReading(d);S.tab='history';render();};
  if($('logBtn'))$('logBtn').onclick=()=>{logReading(S._draft);S.tab='history';render()};
}

const ACTIONS=['Added Chlorine','Shocked','pH Up','pH Down','Added Alkalinity','Backwashed','Brushed','Added CYA','Nothing'];

function renderHistory(b){
  if(!S.history.length){b.innerHTML=`<div class="bin"><div class="empty"><div class="e">📋</div>
    <div class="mono" style="letter-spacing:1px;text-transform:uppercase;font-size:12px">No tests yet</div>
    <div style="font-size:12px;margin-top:6px">Send a strip photo in Chat or enter readings in Chemistry to start tracking.</div></div></div>`;return;}
  let html=`<div class="bin"><div class="mono" style="font-size:10px;color:var(--mut2);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">${S.history.length} test${S.history.length>1?'s':''} recorded</div>`;
  S.history.forEach((e,idx)=>{
    const d=new Date(e.timestamp);
    const ts=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const issues=KEYS.filter(k=>{const v=e[k],r=IDEAL[k];return v!=null&&(v<r.min||v>r.max)});
    const ok=issues.length===0;
    const open=S.openHist===e.timestamp;

    // Action summary line (shown when collapsed)
    const actionSum=e.action?`<div style="font-size:11px;color:var(--aqua);margin-top:6px">↳ ${e.action}${e.actionAmt?' · '+e.actionAmt:''}${e.notes?' · '+e.notes:''}</div>`:'';

    let detail='';
    if(open){
      const doses=doseAdvice(e,e.gallons||S.gallons);
      if(doses.length===0){
        detail=`<div style="margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--green)">✓ Everything was in range — no action needed.</div>`;
      } else {
        detail=`<div style="margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
          <div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px">What to do · for ${(e.gallons||S.gallons).toLocaleString()} gal</div>
          ${doses.map(d=>{const c=d.sev==='high'?'var(--coral)':'var(--aqua)';
            return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600">${d.nm}</span>
              <span class="mono" style="font-size:9px;letter-spacing:1px;color:${c};background:${c}1f;padding:2px 8px;border-radius:5px">${d.sev==='high'?'REDUCE':'ADD'}</span></div>
              <div class="serif" style="font-size:16px;color:var(--aqua2);margin:3px 0">${d.amt}</div>
              <div style="font-size:11.5px;color:var(--mut);line-height:1.5">${d.ex}</div></div>`}).join('')}</div>`;
      }

      // Action tracking section
      detail+=`<div style="margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
        <div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px">What did you do?</div>
        <div class="chips" style="margin-bottom:8px">${ACTIONS.map(a=>
          `<button class="chip hist-action ${e.action===a?'on':''}" data-idx="${idx}" data-action="${a}">${a}</button>`).join('')}</div>
        <input class="hist-amt" data-idx="${idx}" type="text" placeholder="Amount (e.g. 2 lbs, 1 gal acid)" value="${esc(e.actionAmt||'')}"
          style="width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--txt);font-size:12px;font-family:inherit;margin-bottom:8px">
        <div class="mono" style="font-size:9px;color:var(--mut2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;margin-top:4px">Notes</div>
        <input class="hist-notes" data-idx="${idx}" type="text" placeholder="Party, heavy rain, gone for a week…" value="${esc(e.notes||'')}"
          style="width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--txt);font-size:12px;font-family:inherit">
      </div>`;
    }
    html+=`<div class="hcard" data-ts="${e.timestamp}" style="cursor:pointer"><div class="top"><span class="ts">${ts}</span>
      <span class="fl" style="color:${ok?'var(--green)':'var(--coral)'};background:${ok?'rgba(92,200,160,.1)':'rgba(236,138,114,.1)'}">${ok?'All ideal':issues.length+' issue'+(issues.length>1?'s':'')} <span style="opacity:.6">${open?'▴':'▾'}</span></span></div>
      <div class="h5">${KEYS.map(k=>{const v=e[k],c=color(v,k);
        return `<div class="c"><div class="ck">${IDEAL[k].short}</div><div class="cv" style="color:${v!=null?c:'rgba(255,255,255,.15)'}">${v??'-'}</div></div>`}).join('')}</div>${actionSum}${detail}</div>`;
  });
  html+=`<button class="btn" id="clearBtn" style="background:none;border:1px solid rgba(236,138,114,.22);color:rgba(236,138,114,.6);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:11px 16px">Clear history</button></div>`;
  b.innerHTML=html;

  // Card expand/collapse (only on header click)
  b.querySelectorAll('.hcard').forEach(el=>{
    el.querySelector('.top').onclick=(ev)=>{
      ev.stopPropagation();
      const ts=+el.dataset.ts;
      S.openHist=S.openHist===ts?null:ts;
      render();
    };
  });

  // Action chip clicks
  b.querySelectorAll('.hist-action').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      const idx=+btn.dataset.idx;
      const action=btn.dataset.action;
      S.history[idx].action=S.history[idx].action===action?null:action;
      persist();render();
    };
  });

  // Amount fields
  b.querySelectorAll('.hist-amt').forEach(el=>{
    el.onclick=ev=>ev.stopPropagation();
    el.onblur=()=>{
      const idx=+el.dataset.idx;
      S.history[idx].actionAmt=el.value.trim();
      persist();
    };
  });

  // Notes fields
  b.querySelectorAll('.hist-notes').forEach(el=>{
    el.onclick=ev=>ev.stopPropagation();
    el.onblur=()=>{
      const idx=+el.dataset.idx;
      S.history[idx].notes=el.value.trim();
      persist();
    };
  });

  $('clearBtn').onclick=()=>{if(confirm('Clear all history?')){S.history=[];persist();render()}};
}

function renderSchedule(b){
  const now=Date.now(),day=864e5;
  const tasks=[...S.tasks].sort((a,b)=>((a.last+a.int*day)-(b.last+b.int*day)));
  let html=`<div class="bin"><div class="sec"><h2>Maintenance</h2><div class="ln"></div>
    <button class="add" id="addTask">＋ Add task</button></div>`;
  if(!tasks.length){
    html+=`<div class="empty"><div class="e">🗓️</div><div style="font-size:13px">No tasks yet — add your first.</div></div>`;
  }
  tasks.forEach(t=>{
    const dueIn=Math.round((t.last+t.int*day-now)/day);
    let label,c;
    if(t.done){label='done';c='var(--green)';}
    else if(dueIn<0){label=`${-dueIn}d overdue`;c='var(--coral)';}
    else if(dueIn===0){label='due today';c='var(--coral)';}
    else if(dueIn<=2){label=`in ${dueIn}d`;c='var(--amber)';}
    else{label=`in ${dueIn}d`;c='var(--mut)';}
    html+=`<div class="task ${t.done?'done':''}" data-id="${t.id}">
      <div class="cb" data-act="toggle">${t.done?'✓':''}</div>

function buildInsightsContext(){
  if(S.history.length<3)return'';
  const h=S.history;
  const insights=[];

  // 1. FC decay rate (between consecutive readings where no chlorine was added)
  const fcPairs=[];
  for(let i=0;i<h.length-1;i++){
    const cur=h[i],prev=h[i+1];
    if(cur.chlorine!=null&&prev.chlorine!=null&&prev.action!=='Added Chlorine'&&prev.action!=='Shocked'){
      const days=(prev.timestamp-cur.timestamp)/864e5;
      if(days>0&&days<14){
        const rate=(prev.chlorine-cur.chlorine)/days;
        fcPairs.push(rate);
      }
    }
  }
  if(fcPairs.length>=2){
    const avg=(fcPairs.reduce((a,b)=>a+b,0)/fcPairs.length).toFixed(2);
    insights.push(`FC decay rate: approximately ${avg} ppm/day (based on ${fcPairs.length} intervals without chlorine addition)`);
  }

  // 2. pH trend direction
  const phVals=h.filter(e=>e.ph!=null).slice(0,10);
  if(phVals.length>=3){
    const recent=phVals.slice(0,3).reduce((a,e)=>a+e.ph,0)/3;
    const older=phVals.slice(-3).reduce((a,e)=>a+e.ph,0)/Math.min(3,phVals.slice(-3).length);
    const drift=recent-older;
    if(Math.abs(drift)>0.1){
      insights.push(`pH trend: ${drift>0?'rising':'falling'} (avg ${older.toFixed(1)} → ${recent.toFixed(1)} over last ${phVals.length} tests)`);
    } else {
      insights.push(`pH trend: stable around ${recent.toFixed(1)}`);
    }
  }

  // 3. Test frequency
  if(h.length>=3){
    const gaps=[];
    for(let i=0;i<Math.min(h.length-1,10);i++){
      gaps.push((h[i].timestamp-h[i+1].timestamp)/864e5);
    }
    const avgGap=(gaps.reduce((a,b)=>a+b,0)/gaps.length).toFixed(1);
    insights.push(`Average testing frequency: every ${avgGap} days`);
  }

  // 4. Days since last test
  const daysSince=((Date.now()-h[0].timestamp)/864e5).toFixed(1);
  insights.push(`Days since last test: ${daysSince}`);

  // 5. Action effectiveness (before/after for chlorine additions)
  const chlorineActions=[];
  for(let i=0;i<h.length-1;i++){
    if(h[i].action==='Added Chlorine'||h[i].action==='Shocked'){
      const before=h[i].chlorine;
      const after=h[i>0?i-1:0].chlorine;
      if(before!=null&&after!=null&&i>0){
        chlorineActions.push({action:h[i].action,before,after,amt:h[i].actionAmt||'unknown amount'});
      }
    }
  }
  if(chlorineActions.length){
    const summaries=chlorineActions.slice(0,3).map(a=>
      `${a.action} (${a.amt}): FC ${a.before} → ${a.after}`
    );
    insights.push(`Recent chlorine action results: ${summaries.join('; ')}`);
  }

  // 6. Recurring issues
  const issueCounts={};
  h.slice(0,15).forEach(e=>{
    KEYS.forEach(k=>{
      const st=statusOf(e[k],k);
      if(st&&st!=='OK'){
        const key=IDEAL[k].short+' '+st;
        issueCounts[key]=(issueCounts[key]||0)+1;
      }
    });
  });
  const recurring=Object.entries(issueCounts).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]);
  if(recurring.length){
    insights.push(`Recurring issues (last 15 tests): ${recurring.map(([k,c])=>k+' ('+c+'x)').join(', ')}`);
  }

  // 7. Best/worst parameters
  const latest=h[0];
  const perfect=KEYS.filter(k=>latest[k]!=null&&statusOf(latest[k],k)==='OK');
  const problem=KEYS.filter(k=>latest[k]!=null&&statusOf(latest[k],k)!=='OK');
  if(perfect.length)insights.push(`Currently ideal: ${perfect.map(k=>IDEAL[k].short).join(', ')}`);
  if(problem.length)insights.push(`Currently out of range: ${problem.map(k=>IDEAL[k].short+' ('+statusOf(latest[k],k)+')').join(', ')}`);

  return'\n\nPOOL INSIGHTS (computed from history — use these to give specific, data-driven advice):\n'+insights.map(i=>'• '+i).join('\n');
}

function buildHistoryContext(){
  if(!S.history.length)return'';
  const recent=S.history.slice(0,8);
  let ctx='\n\nPOOL HISTORY (last '+recent.length+' saved tests, newest first):\n';
  recent.forEach(e=>{
    const d=new Date(e.timestamp);
    const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const flags=[];
    KEYS.forEach(k=>{
      const v=e[k],st=statusOf(v,k);
      const label=IDEAL[k].short;
      if(v==null){flags.push(label+':—');}
      else if(st==='OK'){flags.push(label+':'+v);}
      else{flags.push(label+':'+v+'('+st+')');}
    });
    const issues=KEYS.filter(k=>{const v=e[k];return v!=null&&statusOf(v,k)!=='OK';});
    const note=issues.length===0?'all OK':issues.map(k=>IDEAL[k].short+' '+statusOf(e[k],k).toLowerCase()).join(', ');
    ctx+='• '+ds+' — '+flags.join(' · ')+' — '+note;
    if(e.action)ctx+=' | Action: '+e.action+(e.actionAmt?' ('+e.actionAmt+')':'');
    if(e.notes)ctx+=' | Notes: '+e.notes;
    ctx+='\n';
  });
  ctx+='Use this history to spot TRENDS and CAUSE-EFFECT patterns. Compare today\'s reading to past ones. When the user logged an action (e.g. "Added Chlorine · 2 lbs"), check if the NEXT reading shows the expected result. Point out what\'s working and what isn\'t.';
  return ctx;
}

const MAX_HISTORY_MSGS=10;
const DAILY_LIMIT=30;
const COOLDOWN_MS=3000;
let lastCallTime=0;

function checkUsage(){
  const today=new Date().toDateString();
  const usage=store.get('usage')||{date:today,count:0};
  if(usage.date!==today){usage.date=today;usage.count=0;}
  if(usage.count>=DAILY_LIMIT)throw new Error(`Daily limit of ${DAILY_LIMIT} requests reached. Resets tomorrow.`);
  usage.count++;store.set('usage',usage);
}

async function callClaude(body){
  const now=Date.now();
  if(now-lastCallTime<COOLDOWN_MS)throw new Error('Please wait a moment before sending another message.');
  lastCallTime=now;
  checkUsage();
  let resp;
  try{resp=await fetch('/.netlify/functions/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
  catch(e){throw new Error('Cannot reach the server. If testing locally, deploy to Netlify first — the AI features need the serverless function.');}
  const text=await resp.text();
  if(resp.status===404)throw new Error('Serverless function not found. Make sure netlify/functions/claude.js is deployed and ANTHROPIC_API_KEY is set in Netlify environment variables.');
  if(!text)throw new Error(`Empty response (status ${resp.status}). Check Netlify function logs for errors.`);
  let data;
  try{data=JSON.parse(text);}catch(e){throw new Error(`Server returned non-JSON (status ${resp.status}): ${text.slice(0,200)}`);}
  if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
  if(!data.content)throw new Error(`No content in API response. Status ${resp.status}. Response: ${text.slice(0,200)}`);
  return data.content.map(c=>c.text||'').join('').trim();
}

async function sendMessage(text){
  if(S.thinking)return;

  if(!hasImage&&!hasText)return;
  if(Date.now()-lastCallTime<COOLDOWN_MS)return;
  const msgText=text||(hasImage?'Please analyze this image as a pool expert.':'');
  const msg={role:'user',content:msgText};

    // Sanitize: must start with 'user' and strictly alternate roles
    const api=[];
    for(const m of raw){
      if(api.length===0&&m.role!=='user') continue;
      if(api.length>0&&api[api.length-1].role===m.role){
        api[api.length-1]=m;
        continue;
      }
      api.push(m);
    }
    // Final verification: check that the last user message in api still has the image
    if(imageData&&imageIncluded){
      const lastUser=api.filter(m=>m.role==='user').pop();
      if(!lastUser||!Array.isArray(lastUser.content)){
        console.error('[Clarity] Image lost during message sanitization!');
        S.messages.push({role:'assistant',content:'⚠ Image was lost while preparing the request. Please try again.'});
        S.thinking=false;render();return;
      }
    }
    const systemPrompt=SYSTEM.replace('{POOL_SIZE}',S.gallons.toLocaleString());
    const historyCtx=buildHistoryContext();
    const profileCtx=buildProfileContext();
    const insightsCtx=buildInsightsContext();
    const notesCtx=S.poolNotes?`\n\nPOOL NOTES (owner's description of their pool situation — factor this into every answer):\n${S.poolNotes}`:'';
    // Use Haiku for strip/image analysis (fast), Opus for reasoning/learning (chat)
    const hasImage=api.some(m=>Array.isArray(m.content)&&m.content.some(c=>c.type==='image'));
    const model=hasImage?STRIP_MODEL:CHAT_MODEL;
    const reply=await callClaude({model,max_tokens:2000,
      system:systemPrompt+`\nUser's pool: inground, ~${S.gallons.toLocaleString()} gallons.`+profileCtx+notesCtx+insightsCtx+historyCtx,messages:api});
    S.messages.push({role:'assistant',content:reply});
  }catch(e){S.messages.push({role:'assistant',content:`⚠ ${e.message}`});}
  S.thinking=false;render();
}

function compressImage(file,maxW=1500){
  return new Promise((res,rej)=>{
    try{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Failed to load image'));};
      img.onload=()=>{
        try{
          const s=Math.min(1,maxW/img.width),c=document.createElement('canvas');
          c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);
          c.toBlob(bl=>{
            if(!bl){rej(new Error('Canvas toBlob failed'));return;}
            const fr=new FileReader();
            fr.onerror=()=>rej(new Error('FileReader failed'));
            fr.onload=()=>{
              const b64=fr.result.split(',')[1];
              if(!b64||b64.length<50){rej(new Error('Base64 conversion produced empty result'));return;}
              console.log('[Clarity] Image compressed:',img.width+'x'+img.height,'→',c.width+'x'+c.height,Math.round(b64.length/1024)+'KB');
              res({base64:b64,mediaType:'image/jpeg'});
            };
            fr.readAsDataURL(bl);
          },'image/jpeg',.92);
        }catch(e){rej(e);}
      };
      img.src=url;
    }catch(e){rej(e);}
  });
}

async function attachImage(file){
  if(!file||!file.type.startsWith('image/'))return;
  try{
    const {base64,mediaType}=await compressImage(file);
    const preview=URL.createObjectURL(file);
    S._pendingImage={base64,mediaType,preview,file};
    renderAttachPreview();
    $('msgIn').focus();
  }catch(e){
    console.error('[Clarity] Image processing failed:',e);
    S.messages.push({role:'assistant',content:`⚠ Couldn't process that image: ${e.message}. Try a different photo.`});
    render();
  }
}
function renderAttachPreview(){
  const el=$('attachPreview');
  if(!S._pendingImage){el.innerHTML='';return;}
  el.innerHTML=`<div class="attach-preview">
    <img src="${S._pendingImage.preview}">
    <div class="attach-info">
      <div class="attach-label">📎 Photo attached</div>
      <div class="attach-hint">Type a question about what you see, or just hit send and I'll analyze it.</div>
    </div>
    <button class="attach-rm" id="attachRmBtn">✕</button>
  </div>`;
  $('attachRmBtn').onclick=()=>{
    if(S._pendingImage?.preview)URL.revokeObjectURL(S._pendingImage.preview);
    S._pendingImage=null;renderAttachPreview();
  };
  $('sendBtn').className='send live';
}

/* ── Event wiring ── */
$('gearBtn').onclick=()=>{S.setupOpen=!S.setupOpen;renderSetup()};
$('sendBtn').onclick=()=>{const v=$('msgIn').value.trim();if(v||S._pendingImage)sendMessage(v)};
$('msgIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=$('msgIn').value.trim();if(v||S._pendingImage)sendMessage(v)}});
$('msgIn').addEventListener('input',e=>{const live=(e.target.value.trim()||S._pendingImage)&&!S.thinking;$('sendBtn').className='send'+(live?' live':'')});
$('camBtn').onclick=()=>$('fileIn').click();
$('uploadBtn').onclick=()=>$('uploadIn').click();
$('fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)attachImage(f);};
$('uploadIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)attachImage(f);};
$('tSave').onclick=saveTask;
$('tDelete').onclick=()=>{if(S.editTask&&confirm('Delete this task?')){S.tasks=S.tasks.filter(x=>x.id!==S.editTask);persist();closeScrim('taskScrim');render();}};
$('taskScrim').onclick=e=>{if(e.target.id==='taskScrim')closeScrim('taskScrim')};

render();
</script>
