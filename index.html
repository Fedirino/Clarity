function buildHistoryContext(){

    const flags=[];
    KEYS.forEach(k=>{

    ctx+='• '+ds+' — '+flags.join(' · ')+' — '+note;

- record_belief — note a qualitative fact the OWNER stated about their pool (e.g. "pump runs 8 hrs/day", "kids swim daily in summer"). args: {"observation": "..."}. This is stored as an owner-confirmed fact, separate from your measured beliefs — do not use it to assert a pattern you only suspect.
When (and only when) you want to propose one or more actions, append a hidden block at the VERY END of your reply, on its own line, after any READINGS block:
<!--ACTIONS:[{"tool":"record_action","args":{"action":"Shocked","amount":"2 lbs"},"label":"Shocked · 2 lbs cal-hypo"}]-->
Rules: max 4 actions; always include a short human "label"; only tools listed above; omit the block entirely when no action is warranted. In your visible text, briefly say what you'll log (e.g. "I can log that shock for you — confirm below."), never that it's already done.

Today is ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}.`;

const MAX_HISTORY_MSGS=10;
const DAILY_LIMIT=30;
const COOLDOWN_MS=3000;
let lastCallTime=0;

function checkUsage(){
  const today=new Date().toDateString();
  const usage=store.get('usage')||{date:today,count:0};
  if(usage.date!==today){usage.date=today;usage.count=0;}
  if(usage.count>=DAILY_LIMIT)throw new Error(`Daily limit of ${DAILY_LIMIT} requests reached. Resets tomorrow.`);
  usage.count++;store.set('usage',usage);
}

async function callClaude(body){
  const now=Date.now();
  if(now-lastCallTime<COOLDOWN_MS)throw new Error('Please wait a moment before sending another message.');
  lastCallTime=now;
  checkUsage();
  let resp;
  let token=null;
  try{token=fbAuth.currentUser?await fbAuth.currentUser.getIdToken():null;}catch(e){}
  const hdrs={'Content-Type':'application/json'};
  if(token)hdrs['Authorization']='Bearer '+token;
  try{resp=await fetch('/api/claude',{method:'POST',headers:hdrs,body:JSON.stringify(body)});}
  catch(e){throw new Error('Cannot reach the server. Check your connection — the AI features need the Firebase function deployed.');}
  const text=await resp.text();
  if(resp.status===404)throw new Error('Proxy not found. Make sure the "claude" function is deployed and the /api/claude rewrite is live (firebase deploy).');
  if(resp.status===401||resp.status===403)throw new Error('Sign-in problem — try signing out and back in.');
  if(!text)throw new Error(`Empty response (status ${resp.status}). Check Netlify function logs for errors.`);
  let data;
  try{data=JSON.parse(text);}catch(e){throw new Error(`Server returned non-JSON (status ${resp.status}): ${text.slice(0,200)}`);}
  if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
  if(!data.content)throw new Error(`No content in API response. Status ${resp.status}. Response: ${text.slice(0,200)}`);
  return data.content.map(c=>c.text||'').join('').trim();
}

async function sendMessage(text){
  if(S.thinking)return;
  const hasImage=!!S._pendingImage;
  const hasText=!!text;
  if(!hasImage&&!hasText)return;
  if(Date.now()-lastCallTime<COOLDOWN_MS)return;
  const msgText=text||(hasImage?'Please analyze this image as a pool expert.':'');
  const msg={role:'user',content:msgText};
  let imageData=null;
  if(hasImage){
    // Verify we actually have base64 data before claiming image is attached
    if(!S._pendingImage.base64||S._pendingImage.base64.length<100){
      S.messages.push({role:'assistant',content:'⚠ Image failed to process. Please try attaching it again.'});
      S._pendingImage=null;renderAttachPreview();render();return;
    }
    imageData={base64:S._pendingImage.base64,mediaType:S._pendingImage.mediaType,preview:S._pendingImage.preview};
    msg._image=imageData.preview;
    msg._imageSize=imageData.base64.length; // track for confirmation
    msg._imgB64=imageData.base64; msg._imgMedia=imageData.mediaType; // persist so follow-up turns can re-examine the same photo
    console.log('[Clarity] Image attached:',Math.round(imageData.base64.length/1024)+'KB base64,',imageData.mediaType);
    S._pendingImage=null;
    renderAttachPreview();
  }
  S.messages.push(msg);
  $('msgIn').value='';
  $('sendBtn').className='send';
  S.thinking=true;render();
  try{
    const raw=[];
    const filtered=S.messages.filter(m=>m.role==='user'||m.role==='assistant');
    const recent=filtered.slice(-MAX_HISTORY_MSGS);
    let imageIncluded=false;
    // Re-attach photos that are still in the recent window so follow-up turns
    // ("is this accurate?") keep the actual image in view. Cap to the 2 newest
    // images to stay under the request size limit; chart rides with the latest.
    const imgIdx=recent.map((m,i)=>m._imgB64?i:-1).filter(i=>i>=0);
    const keepImgs=new Set(imgIdx.slice(-2));
    const latestImg=imgIdx.length?imgIdx[imgIdx.length-1]:-1;
    recent.forEach((m,i)=>{
      if(m._imgB64&&keepImgs.has(i)){
        const content=[];
        if(i===latestImg){
          content.push({type:'text',text:'This is a strip reading. The dipped strip is seated in the channel on the LEFT EDGE of the AquaChek card — the vertical column of real color pads on the far-left side, with arrows pointing right to each parameter row. READ EVERY PAD against the row its arrow points to, and give your best estimate for each WITH an honest confidence percent (0-100%). Pads may be pale/near-white (low free/total chlorine, low CYA) and blend into the white channel — read them anyway and set a lower confidence if unsure; faint is not empty. Do NOT refuse, do NOT ask to confirm the strip is there, do NOT ask for a new photo first — always produce the reading and let the confidence percent carry any uncertainty. Only give no reading if this is not a strip/card photo at all, or it is so blurred/dark you cannot even guess. End with the hidden READINGS block including the confidence object.'});
        }
        content.push({type:'image',source:{type:'base64',media_type:m._imgMedia,data:m._imgB64}});
        content.push({type:'text',text:m.content||'Please analyze this image as a pool expert.'});
        raw.push({role:'user',content});
        if(m===msg)imageIncluded=true;
      } else if(m._imgB64){
        raw.push({role:m.role,content:(m.content||'')+' [an earlier photo was here]'});
      } else {
        raw.push({role:m.role,content:m.content});
      }
    });
    // If we had imageData but it wasn't included (edge case), warn
    if(imageData&&!imageIncluded){
      console.warn('[Clarity] Image was attached but not included in API call — message may have been outside recent history window');
      S.messages.push({role:'assistant',content:'⚠ Something went wrong attaching the image. Please try again.'});
      S.thinking=false;render();return;
    }
    if(imageData&&imageIncluded){
      console.log('[Clarity] Image confirmed in API payload');
    }
    // Sanitize: must start with 'user' and strictly alternate roles
    const api=[];
    for(const m of raw){
      if(api.length===0&&m.role!=='user') continue;
      if(api.length>0&&api[api.length-1].role===m.role){
        api[api.length-1]=m;
        continue;
      }
      api.push(m);
    }
    // Final verification: check that the last user message in api still has the image
    if(imageData&&imageIncluded){
      const lastUser=api.filter(m=>m.role==='user').pop();
      if(!lastUser||!Array.isArray(lastUser.content)){
        console.error('[Clarity] Image lost during message sanitization!');
        S.messages.push({role:'assistant',content:'⚠ Image was lost while preparing the request. Please try again.'});
        S.thinking=false;render();return;
      }
    }
    const systemPrompt=SYSTEM.replace('{POOL_SIZE}',S.gallons.toLocaleString());
    updatePoolModel(); // refresh beliefs before Clarity reasons (runs only if the model is enabled)
    const historyCtx=buildHistoryContext();
    const profileCtx=buildProfileContext();
    const insightsCtx=buildInsightsContext();
    const modelCtx=buildPoolModelContext();
    const weatherCtx=buildWeatherContext();
    const notesCtx=S.poolNotes?`\n\nPOOL NOTES (owner's description of their pool situation — factor this into every answer):\n${S.poolNotes}`:'';
    // Use Haiku for strip/image analysis (fast), Opus for reasoning/learning (chat)
    const hasImage=api.some(m=>Array.isArray(m.content)&&m.content.some(c=>c.type==='image'));
    const model=hasImage?STRIP_MODEL:CHAT_MODEL;
    const reply=await callClaude({model,max_tokens:hasImage?5000:2000,...(hasImage?{thinking:{type:'enabled',budget_tokens:3000},temperature:1}:{}),
      system:systemPrompt+`\nUser's pool: inground, ~${S.gallons.toLocaleString()} gallons.`+profileCtx+notesCtx+weatherCtx+modelCtx+insightsCtx+historyCtx,messages:api});
    S.messages.push({role:'assistant',content:reply});
  }catch(e){S.messages.push({role:'assistant',content:`⚠ ${e.message}`});}
  S.thinking=false;render();
}

function compressImage(file,maxW=1500){
  return new Promise((res,rej)=>{
    try{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Failed to load image'));};
      img.onload=()=>{
        try{
          const s=Math.min(1,maxW/img.width),c=document.createElement('canvas');
          c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);
          c.toBlob(bl=>{
            if(!bl){rej(new Error('Canvas toBlob failed'));return;}
            const fr=new FileReader();
            fr.onerror=()=>rej(new Error('FileReader failed'));
            fr.onload=()=>{
              const b64=fr.result.split(',')[1];
              if(!b64||b64.length<50){rej(new Error('Base64 conversion produced empty result'));return;}
              console.log('[Clarity] Image compressed:',img.width+'x'+img.height,'→',c.width+'x'+c.height,Math.round(b64.length/1024)+'KB');
              res({base64:b64,mediaType:'image/jpeg'});
            };
            fr.readAsDataURL(bl);
          },'image/jpeg',.92);
        }catch(e){rej(e);}
      };
      img.src=url;
    }catch(e){rej(e);}
  });
}

async function attachImage(file){
  if(!file||!file.type.startsWith('image/'))return;
  try{
    const {base64,mediaType}=await compressImage(file);
    const preview=URL.createObjectURL(file);
    S._pendingImage={base64,mediaType,preview,file};
    renderAttachPreview();
    $('msgIn').focus();
  }catch(e){
    console.error('[Clarity] Image processing failed:',e);
    S.messages.push({role:'assistant',content:`⚠ Couldn't process that image: ${e.message}. Try a different photo.`});
    render();
  }
}
function renderAttachPreview(){
  const el=$('attachPreview');
  if(!S._pendingImage){el.innerHTML='';return;}
  el.innerHTML=`<div class="attach-preview">
    <img src="${S._pendingImage.preview}">
    <div class="attach-info">
      <div class="attach-label">📎 Photo attached</div>
      <div class="attach-hint">Type a question about what you see, or just hit send and I'll analyze it.</div>
    </div>
    <button class="attach-rm" id="attachRmBtn">✕</button>
  </div>`;
  $('attachRmBtn').onclick=()=>{
    if(S._pendingImage?.preview)URL.revokeObjectURL(S._pendingImage.preview);
    S._pendingImage=null;renderAttachPreview();
  };
  $('sendBtn').className='send live';
}

/* ── Event wiring ── */
$('gearBtn').onclick=()=>{S.setupOpen=!S.setupOpen;renderSetup()};
$('sendBtn').onclick=()=>{const v=$('msgIn').value.trim();if(v||S._pendingImage)sendMessage(v)};
$('msgIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=$('msgIn').value.trim();if(v||S._pendingImage)sendMessage(v)}});
$('msgIn').addEventListener('input',e=>{const live=(e.target.value.trim()||S._pendingImage)&&!S.thinking;$('sendBtn').className='send'+(live?' live':'')});
$('camBtn').onclick=()=>$('fileIn').click();
$('uploadBtn').onclick=()=>$('uploadIn').click();
$('fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)attachImage(f);};
$('uploadIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)attachImage(f);};
$('tSave').onclick=saveTask;
$('tDelete').onclick=()=>{if(S.editTask&&confirm('Delete this task?')){S.tasks=S.tasks.filter(x=>x.id!==S.editTask);persist();closeScrim('taskScrim');render();}};
$('taskScrim').onclick=e=>{if(e.target.id==='taskScrim')closeScrim('taskScrim')};

/* ── Auth gate & boot ──
   The app only renders after sign-in. While signed out, the gate overlay
   covers everything. On sign-in we pull cloud data, then render. */
const _authGate=$('authGate'), _authErr=$('authErr');
$('signInBtn').onclick=()=>{
  _authErr.textContent='';
  fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e=>{_authErr.textContent=e.message||'Sign-in failed. Try again.';});
};
fbAuth.onAuthStateChanged(async user=>{
  if(user){
    _uid=user.uid;
    _authGate.style.display='none';
    await cloudHydrate();
    render();
    fetchWeather(); // Phase 4: pull the local forecast once signed in (self-guards if no location)
  }else{
    _uid=null;
    _authGate.style.display='flex';
  }
});
